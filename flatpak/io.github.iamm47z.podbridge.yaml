app-id: io.github.iamm47z.podbridge
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: podbridge

# Hi-res microphone deps (verified present in org.freedesktop.Platform 25.08):
#   - libavcodec.so.61 / libavutil.so.59 (FFmpeg 7.1) for AAC-ELD decode.
#     ffmpeg-sys-next auto-detects this version at build time, so no pin needed.
#   - libpulse-simple.so.0 for the PCM playback stream.
# The virtual mic is created over the existing --socket=pulseaudio (module load
# + playback are protocol calls; no extra finish-args, no pactl/pw-cat needed).
# Build note: ffmpeg-sys-next runs bindgen, which needs libclang from the SDK.

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --system-talk-name=org.bluez
  - --allow=bluetooth
  - --share=network
  - --socket=session-bus

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/podbridge/cargo
    CARGO_NET_OFFLINE: 'true'
    RUSTUP_HOME: /usr/lib/sdk/rust-stable

modules:
  - name: podbridge
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --frozen --offline --verbose
      - install -Dm755 target/release/podbridge ${FLATPAK_DEST}/bin/podbridge
      - install -Dm644 assets/icon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.iamm47z.podbridge.png
      - install -Dm644 assets/icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.iamm47z.podbridge.svg
      - install -Dm644 assets/io.github.iamm47z.podbridge.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/io.github.iamm47z.podbridge.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      # The vendored source tarball from `just tarball local`.
      - type: archive
        path: ../dist/podbridge-vlocal-source.tar.gz
