# Hooks for prek (https://github.com/j178/prek); `prek install` sets up both stages.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        files: '(\.rs|Cargo\.(toml|lock))$'
        pass_filenames: false
        stages: [pre-commit]
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked
        language: system
        files: '(\.rs|Cargo\.(toml|lock))$'
        pass_filenames: false
        stages: [pre-push]
