name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libdbus-1-dev libpulse-dev \
            libavutil-dev libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswresample-dev libswscale-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      # shortcut: warnings only until the inherited ones are cleaned up; then add -D warnings.
      - name: Clippy
        run: cargo clippy --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked
