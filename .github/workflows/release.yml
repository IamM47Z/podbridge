name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP: podbridge
      APP_ID: io.github.iamm47z.podbridge
      LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
      LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      # appimagetool otherwise downloads the runtime from a moving "continuous" release.
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      # The runners have no FUSE, so the AppImage tools unpack themselves instead.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # linuxdeploy's own strip cannot read .relr.dyn sections of current distro
      # libraries, which come stripped anyway.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libdbus-1-dev libpulse-dev \
            libavutil-dev libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libswresample-dev libswscale-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist

          stage="$APP-$GITHUB_REF_NAME-x86_64-linux"
          mkdir "$stage"
          cp "target/release/$APP" LICENSE NOTICE README.md assets/font/*.txt \
            "assets/$APP_ID.desktop" assets/icon.png "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"

          curl -fsSLo linuxdeploy "$LINUXDEPLOY_URL"
          curl -fsSLo appimagetool "$APPIMAGETOOL_URL"
          curl -fsSLo runtime "$RUNTIME_URL"
          printf '%s  linuxdeploy\n%s  appimagetool\n%s  runtime\n' \
            "$LINUXDEPLOY_SHA256" "$APPIMAGETOOL_SHA256" "$RUNTIME_SHA256" | sha256sum -c -
          chmod +x linuxdeploy appimagetool

          # linuxdeploy names the icon after its file, which must match Icon= in the desktop file.
          cp assets/icon.png "$APP_ID.png"
          ./linuxdeploy --appdir AppDir --executable "target/release/$APP" \
            --desktop-file "assets/$APP_ID.desktop" --icon-file "$APP_ID.png"
          install -Dm644 -t "AppDir/usr/share/licenses/$APP/" LICENSE NOTICE assets/font/*.txt
          ARCH=x86_64 ./appimagetool --runtime-file runtime AppDir "dist/$APP-$GITHUB_REF_NAME-x86_64.AppImage"

          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ $GITHUB_REF_NAME == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${flags[@]}"
